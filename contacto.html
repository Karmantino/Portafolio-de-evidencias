    <h1>Contactame</h1>

    <main class="principal">
        <section class="texto">
            <h2>Ponte en contacto</h2>
            <p>Si necesitas algo dímelo.</p>

            <form class="form" action="mailto:karmantinomar@gmail.com" method="POST" enctype="text/plain">
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo del mensaje" required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="button">Enviar mensaje</button>
            </form>
        </section>
    </main>
